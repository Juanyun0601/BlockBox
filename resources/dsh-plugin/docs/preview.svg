    <rect x="428" y="135" width="88" height="8" rx="4" fill="#cdd8e6"/>
    <circle cx="564" cy="139" r="6" fill="#3fb950"/>
    <path d="M561 139l2.4 2.4 4-4.4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="400" y="160" width="176" height="26" rx="8" fill="#f1f5fa"/>
    <rect x="408" y="167" width="12" height="12" rx="3" fill="#e0a33a"/>
    <rect x="428" y="169" width="116" height="8" rx="4" fill="#cdd8e6"/>
    <circle cx="564" cy="173" r="6" fill="#3fb950"/>
