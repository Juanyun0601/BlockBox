# 方块盒子桥接：安装后自动发现本机方块盒子的「本地 MCP 服务器」，
# 把它的工具接进 DSH（模型侧看到 mcp__blockbox__<工具名>）。
#
# 前置条件（方块盒子侧，用户自己决定是否开启）：
#   方块盒子 → 设置 → AI 助手 → 本地 MCP 服务器 → 勾选「启用本地 MCP 服务器」
# 端口和访问令牌由本插件自动从方块盒子设置里读取，不用手填。
#
# 可选项（写在 config 里可覆盖自动发现，一般不用动）：
#   port      指定端口，默认读方块盒子设置，再退回 17890
#   token     指定访问令牌，默认读方块盒子设置
#   pollMs    重新检测间隔（毫秒），默认 20000
#   systemPrompt 是否向模型注入使用说明，默认 true
- insert:
    - id: blockbox-bridge
      name: dsh-blockbox-bridge
      config: {}
